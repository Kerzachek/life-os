name: home_organizer
description: "Cross-Platform Life Organizer (Personal ERP) built with Flutter"
publish_to: 'none'

version: 1.5.3+13

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.3.3
  intl: ^0.20.3
  fl_chart: ^1.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  crypto: ^3.0.7
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  package_info_plus: ^9.0.0
  pub_semver: ^2.2.1
  local_notifier: ^0.1.6
  tray_manager: ^0.8.0
  window_manager: ^0.5.2
  launch_at_startup: ^0.5.1
  flutter_local_notifications: ^22.3.2
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.ico
    - assets/tray_icon.png
